spring:
  application:
    name: buzz-analysis-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buzz_analysis}
    username: ${DB_USERNAME:buzz_user}
    password: ${DB_PASSWORD:buzz_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # ローカル開発では docker-compose の MailHog(SMTP互換のテスト用メールキャッチャー、
    # http://localhost:8025 でWeb UI閲覧可)宛に送信する。本番は環境変数で実SMTPに差し替える。
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789abcdef}
  issuer: ${JWT_ISSUER:buzz-analysis-platform}
  access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}

app:
  cors:
    # フロントエンド(Next.js)は別オリジン(別ポート)からブラウザ経由でAPIを呼び出すため、
    # CORS許可オリジンの設定が必要。カンマ区切りで複数指定可能。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # レポートのローカルストレージ配信URL(storage.provider=local時)の組み立てに使う自ホストのベースURL。
  base-url: ${APP_BASE_URL:http://localhost:8080}
  quota:
    # ユーザー単位・1日あたりの投稿分析(OpenAI呼び出しを伴う)回数の上限。
    daily-openai-calls: ${QUOTA_DAILY_OPENAI_CALLS:50}
  rate-limit:
    # ログイン/登録エンドポイントへの、送信元IPごとの試行回数上限(ブルートフォース対策)。
    auth-max-attempts: ${RATE_LIMIT_AUTH_MAX_ATTEMPTS:10}
    auth-window-minutes: ${RATE_LIMIT_AUTH_WINDOW_MINUTES:15}
  mail:
    # パスワードリセットメールに載せるリンクの遷移先(フロントエンドのパスワード再設定ページ)。
    reset-link-base-url: ${MAIL_RESET_LINK_BASE_URL:http://localhost:3000/reset-password}
    # メールアドレス確認メールに載せるリンクの遷移先(フロントエンドのメール確認ページ)。
    verification-link-base-url: ${MAIL_VERIFICATION_LINK_BASE_URL:http://localhost:3000/verify-email}
    # しきい値アラートメールに載せるリンクの遷移先(フロントエンドの保存済み分析一覧ページ)。
    saved-analyses-url: ${MAIL_SAVED_ANALYSES_URL:http://localhost:3000/saved}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@buzz-analysis.local}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}

sns:
  # 各SNSともアクセストークン(等)が未設定の場合はモックデータにフォールバックする(開発・デモ用)。
  # 実際の取得元・取得可能な範囲はREADMEの「SNS公式API連携」セクションを参照。
  instagram:
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    # Business Discovery呼び出しの起点となる、自社のInstagramビジネス/クリエイターアカウントのIG User ID。
    business-account-id: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:}
    graph-api-base-url: ${INSTAGRAM_GRAPH_API_BASE_URL:https://graph.facebook.com/v19.0}
  tiktok:
    # TikTok Login KitのOAuth認可で取得したアクセストークン(認可元アカウント自身のデータのみ取得可能)。
    access-token: ${TIKTOK_ACCESS_TOKEN:}
    api-base-url: ${TIKTOK_API_BASE_URL:https://open.tiktokapis.com/v2}
  x:
    bearer-token: ${X_BEARER_TOKEN:}
    api-base-url: ${X_API_BASE_URL:https://api.twitter.com/2}

batch:
  sync:
    # 定期データ取得バッチ（自動化）。デフォルトはOFF。有効化すると、追跡対象アカウントの最新公開投稿を
    # cronスケジュールで定期的に取得し、BuzzScore・ランキングを自動更新する（公式API/スタブへのアクセスが発生する）。
    enabled: ${BATCH_SYNC_ENABLED:false}
    cron: ${BATCH_SYNC_CRON:0 0 * * * *}
    post-limit-per-account: ${BATCH_SYNC_POST_LIMIT:20}
    delay-between-accounts-ms: ${BATCH_SYNC_DELAY_MS:500}
    ranking-candidate-pool-size: ${BATCH_SYNC_RANKING_POOL_SIZE:200}
    ranking-top-n: ${BATCH_SYNC_RANKING_TOP_N:20}
  trend:
    # トレンド分析の日次自動実行（AIマーケティングOS Phase15）。デフォルトはOFF。
    # 蓄積済みデータのみを対象とするため、有効化しても外部APIへの新規アクセスは発生しない。
    enabled: ${BATCH_TREND_ENABLED:false}
    cron: ${BATCH_TREND_CRON:0 0 3 * * *}
    recent-window-days: ${BATCH_TREND_RECENT_WINDOW_DAYS:7}
    baseline-window-days: ${BATCH_TREND_BASELINE_WINDOW_DAYS:21}
  alert:
    # 保存済み分析に設定されたBuzzScoreしきい値の超過チェック・メール通知バッチ。デフォルトはOFF。
    # 蓄積済みデータのみを参照する(外部SNS APIへのアクセスは発生しない)。
    enabled: ${BATCH_ALERT_ENABLED:false}
    cron: ${BATCH_ALERT_CRON:0 0 * * * *}

storage:
  # local: ファイルシステムにレポートを保存する既定値(Docker/MinIOなしでも動作する)。
  # s3: AWS S3 / MinIO等のS3互換ストレージを使う(docker-composeプロファイルでは既定でこちらに切り替わる)。
  provider: ${STORAGE_PROVIDER:local}
  local:
    base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/reports}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-northeast-1}
    bucket: ${S3_BUCKET:buzz-analysis-reports}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    presigned-url-expiration-minutes: ${S3_PRESIGNED_URL_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # メール送信は失敗してもログに残すだけでリクエスト自体は成功させる設計(SmtpMailSenderAdapter)
    # のため、SMTPリレーの一時的な不通で/actuator/health全体がDOWNになりDockerヘルスチェックが
    # 落ちるのを防ぐ。
    mail:
      enabled: false

logging:
  level:
    com.buzzanalysis: INFO
  pattern:
    # requestId(相関ID)を含めることで、1リクエストにまたがる全ログ行を1つのIDで追跡できるようにする
    # (RequestIdFilterがMDCに設定する)。本番障害調査の効率化が目的。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [reqId=%X{requestId:-none}] %logger{36} - %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [reqId=%X{requestId:-none}] %logger{36} - %msg%n%wEx"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:buzz_analysis}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

storage:
  provider: ${STORAGE_PROVIDER:s3}
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
