<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成AIパスポート試験 用語集</title>
<style>
:root{
  --bg:#ffffff;
  --fg:#1a1a1a;
  --muted:#6b7280;
  --card-bg:#f8f9fb;
  --card-border:#e3e6ea;
  --accent:#2563eb;
  --accent-fg:#ffffff;
  --header-bg:#ffffff;
  --overlay:rgba(0,0,0,0.5);
  --ch1:#2563eb;
  --ch2:#7c3aed;
  --ch3:#059669;
  --ch4:#d97706;
  --ch5:#db2777;
  --chip-bg:#eef1f5;
  --chip-fg:#374151;
  --chip-active-bg:#2563eb;
  --chip-active-fg:#ffffff;
  --track:#e5e7eb;
}
:root[data-theme="dark"]{
  --bg:#111317;
  --fg:#e9eaec;
  --muted:#9aa1ac;
  --card-bg:#1a1d23;
  --card-border:#2a2e36;
  --accent:#60a5fa;
  --accent-fg:#0b1220;
  --header-bg:#15171c;
  --overlay:rgba(0,0,0,0.7);
  --chip-bg:#20242c;
  --chip-fg:#c7cbd3;
  --chip-active-bg:#60a5fa;
  --chip-active-fg:#0b1220;
  --track:#2a2e36;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --fg:#e9eaec; --muted:#9aa1ac; --card-bg:#1a1d23; --card-border:#2a2e36;
    --accent:#60a5fa; --accent-fg:#0b1220; --header-bg:#15171c; --overlay:rgba(0,0,0,0.7);
    --chip-bg:#20242c; --chip-fg:#c7cbd3; --chip-active-bg:#60a5fa; --chip-active-fg:#0b1220; --track:#2a2e36;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  background:var(--bg);
  color:var(--fg);
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);}
header{
  position:sticky;top:0;z-index:20;
  background:var(--header-bg);
  border-bottom:1px solid var(--card-border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
header h1{
  font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;
}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;}
.theme-btn{
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--fg);
  border-radius:20px;
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}
.theme-btn:hover{border-color:var(--accent);}
main{max-width:1100px;margin:0 auto;padding:16px;}
.controls{
  display:flex;flex-direction:column;gap:12px;
  margin-bottom:16px;
}
.search-wrap{position:relative;}
#search{
  width:100%;
  padding:12px 14px;
  font-size:15px;
  border-radius:10px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--fg);
}
#search:focus{outline:2px solid var(--accent);outline-offset:1px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.chip{
  border:1px solid var(--card-border);
  background:var(--chip-bg);
  color:var(--chip-fg);
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;
  cursor:pointer;
  user-select:none;
  display:inline-flex;align-items:center;gap:6px;
}
.chip input{accent-color:var(--accent);}
.chip.active{background:var(--chip-active-bg);color:var(--chip-active-fg);border-color:var(--chip-active-bg);}
.sort-toggle{display:inline-flex;border:1px solid var(--card-border);border-radius:999px;overflow:hidden;}
.sort-toggle button{
  border:none;background:var(--chip-bg);color:var(--chip-fg);
  padding:7px 14px;font-size:13px;cursor:pointer;
}
.sort-toggle button.active{background:var(--accent);color:var(--accent-fg);}
.status-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);}
.progress-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;}
.progress-track{flex:1;height:8px;border-radius:5px;background:var(--track);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .2s ease;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  gap:12px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:14px;
  cursor:pointer;
  display:flex;flex-direction:column;gap:8px;
  transition:border-color .15s ease, transform .1s ease;
}
.card:hover{border-color:var(--accent);}
.card:active{transform:scale(0.99);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-size:15px;font-weight:700;word-break:break-word;}
.learned-toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;flex-shrink:0;}
.learned-toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.tag{
  display:inline-block;font-size:11px;font-weight:600;color:#fff;
  padding:2px 8px;border-radius:999px;width:fit-content;
}
.tag.ch1{background:var(--ch1);}
.tag.ch2{background:var(--ch2);}
.tag.ch3{background:var(--ch3);}
.tag.ch4{background:var(--ch4);}
.tag.ch5{background:var(--ch5);}
.category{font-size:11px;color:var(--muted);}
.desc-preview{
  font-size:13px;color:var(--fg);opacity:.85;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card.learned{opacity:.6;}
.card.learned .card-title{text-decoration:line-through;text-decoration-color:var(--muted);}
.empty{
  text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;
}
/* modal */
.overlay{
  position:fixed;inset:0;background:var(--overlay);
  display:none;align-items:flex-end;justify-content:center;
  z-index:50;
}
.overlay.open{display:flex;}
.modal{
  background:var(--bg);
  border-radius:16px 16px 0 0;
  max-width:560px;width:100%;
  max-height:85vh;overflow-y:auto;
  padding:20px;
  border:1px solid var(--card-border);
  border-bottom:none;
}
@media (min-width:640px){
  .overlay{align-items:center;}
  .modal{border-radius:16px;border-bottom:1px solid var(--card-border);margin:16px;}
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.modal-title{font-size:20px;font-weight:700;}
.close-btn{
  background:var(--chip-bg);border:none;color:var(--fg);
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;
}
.modal-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.modal-category{font-size:13px;color:var(--muted);}
.modal-desc{font-size:15px;line-height:1.9;white-space:pre-wrap;}
.modal-features{margin-top:18px;}
.modal-features-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase;}
.modal-features ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.modal-features li{
  font-size:14px;line-height:1.6;padding:8px 12px;border-radius:8px;
  background:var(--chip-bg);position:relative;padding-left:26px;
}
.modal-features li::before{content:"•";position:absolute;left:11px;color:var(--accent);font-weight:700;}
.modal-footer{margin-top:20px;display:flex;justify-content:flex-end;}
.learn-btn{
  border:1px solid var(--accent);background:transparent;color:var(--accent);
  padding:10px 18px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;
}
.learn-btn.on{background:var(--accent);color:var(--accent-fg);}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 40px;}
</style>
</head>
<body>
<header>
  <h1>生成AIパスポート 用語集<small>GUGA公式シラバス対応（2026年2月試験〜）</small></h1>
  <button class="theme-btn" id="themeBtn" type="button">🌙 ダークモード</button>
</header>

<main>
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="用語・解説を検索（例：ハルシネーション、著作権 など）" autocomplete="off">
    </div>
    <div class="row" id="chapterChips"></div>
    <div class="row" style="justify-content:space-between;">
      <div class="sort-toggle" id="sortToggle">
        <button data-sort="chapter" class="active" type="button">章順</button>
        <button data-sort="kana" type="button">五十音順</button>
      </div>
      <div class="row">
        <span class="chip" id="showLearned" role="button">習得済みのみ</span>
        <span class="chip" id="showUnlearned" role="button">未習得のみ</span>
      </div>
    </div>
    <div class="status-row">
      <span id="countText">表示中 0 / 全0語</span>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <span id="progressText">覚えた 0 / 0（0%）</span>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">該当する用語が見つかりませんでした。</div>
</main>

<footer>本アプリは学習支援を目的とした非公式の教材です。試験の出題内容を保証するものではありません。</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="mTitle"></div>
      <button class="close-btn" id="closeBtn" type="button">✕</button>
    </div>
    <div class="modal-meta">
      <span class="tag" id="mTag"></span>
      <span class="modal-category" id="mCategory"></span>
    </div>
    <div class="modal-desc" id="mDesc"></div>
    <div class="modal-features" id="mFeatures" style="display:none;">
      <div class="modal-features-title">特徴</div>
      <ul id="mFeaturesList"></ul>
    </div>
    <div class="modal-footer">
      <button class="learn-btn" id="mLearnBtn" type="button"></button>
    </div>
  </div>
</div>

<script>
const TERMS = [
// ===== 第1章 AI（人工知能） =====
{t:"AI（人工知能）",c:1,g:"AIの基礎",d:`人間の知能を模倣し、学習・推論・判断などの知的な処理をコンピュータで実現する技術や研究分野の総称。明確な単一の定義はなく、研究者によって捉え方が異なる。`,f:["統一された定義はなく論者により幅がある","「人工的に知能をつくる」という広い概念","AI効果により指す範囲が変動しやすい"]},
{t:"ダートマス会議",c:1,g:"AIの基礎",d:`1956年に米国ダートマス大学で開催された会議。「人工知能（AI）」という用語が初めて使われ、AI研究分野の始まりとされる歴史的な会合。`,f:["1956年、米国ダートマス大学で開催","ジョン・マッカーシーらが提唱・主催","「Artificial Intelligence」という語が初めて使われた"]},
{t:"ルールベース",c:1,g:"AIの基礎",d:`あらかじめ人間が定めた「もしAならばB」といった条件・規則に従って判断や処理を行う手法。初期のAIで多く用いられ、状況の変化に弱いという弱点がある。`,f:["if-then形式の条件分岐で判断する","第一次・第二次AIブームの中心技術","想定外のパターンや例外に弱い"]},
{t:"機械学習",c:1,g:"機械学習",d:`コンピュータが大量のデータからパターンや規則性を自動的に学習し、未知のデータに対する予測や判断を可能にする技術。AIを実現する代表的な手法の一つ。`,f:["データから統計的にパターンを学習する技術","教師あり学習・教師なし学習・強化学習に大別","ディープラーニングは機械学習の一分野"]},
{t:"学習済みモデル",c:1,g:"機械学習",d:`訓練データを用いて機械学習アルゴリズムによる学習を終え、新しい入力データに対して予測や推論ができるようになったモデルのこと。`,f:["学習フェーズを終え推論に使える状態","転移学習やファインチューニングの土台になる"]},
{t:"教師あり学習",c:1,g:"機械学習",d:`入力データと正解ラベルのペアを用いて学習する機械学習の手法。分類や回帰問題に用いられ、未知データへの予測精度向上を目指す。`,f:["入力とラベルのペアで学習する","代表的なタスク：分類・回帰","スパム判定や需要予測などに応用"]},
{t:"教師なし学習",c:1,g:"機械学習",d:`正解ラベルのないデータからデータ自体の構造やパターンを見つけ出す機械学習の手法。クラスタリングや次元削減などに用いられる。`,f:["正解ラベルなしでデータの構造を学習","代表的な手法：クラスタリング・次元削減"]},
{t:"クラスタリング",c:1,g:"機械学習",d:`データを類似性に基づいていくつかのグループ（クラスタ）に分ける教師なし学習の手法。データの傾向把握や分類に利用される。`,f:["データを類似度でグループ分けする教師なし学習","代表例：顧客セグメンテーション"]},
{t:"次元削減",c:1,g:"機械学習",d:`高次元のデータを、情報をできるだけ保持したまま低次元のデータに変換する手法。可視化や計算負荷の軽減、ノイズ除去などに用いられる。`,f:["高次元データを低次元に圧縮する手法","可視化・ノイズ除去・計算負荷軽減に活用","代表手法：主成分分析（PCA）"]},
{t:"強化学習",c:1,g:"機械学習",d:`エージェントが環境と相互作用しながら、得られる報酬を最大化するように試行錯誤を通じて行動方針を学習する機械学習の手法。`,f:["エージェント・環境・報酬が基本要素","試行錯誤で行動方針（方策）を最適化","AlphaGoなどのゲームAIで成果を上げた"]},
{t:"半教師あり学習",c:1,g:"機械学習",d:`少量のラベル付きデータと大量のラベルなしデータを組み合わせて学習を行う手法。ラベル付けのコストを抑えつつ精度向上を図る。`,f:["少量のラベル付きデータと大量の未ラベルデータを併用","ラベル付けコストの削減に有効"]},
{t:"ノーフリーランチ定理",c:1,g:"機械学習",d:`あらゆる問題に対して万能に優れたアルゴリズムは存在せず、特定の問題に最適化された手法にはトレードオフが伴うことを示す定理。`,f:["あらゆる問題に万能な最強アルゴリズムは存在しないとする定理","モデル選定にはトレードオフの理解が必要"]},
{t:"ニューロン",c:1,g:"ニューラルネットワークの仕組み",d:`脳や神経系を構成する神経細胞。他の神経細胞から信号を受け取り、処理して次の細胞へ伝達する働きを持ち、人工ニューロンのモデルの元になった。`,f:["脳の神経細胞、信号の受信・伝達を担う","人工ニューロンのモデルの着想元"]},
{t:"シナプス",c:1,g:"ニューラルネットワークの仕組み",d:`ニューロン同士が接続し、電気的・化学的な信号をやり取りする接合部分。人工ニューラルネットワークの「重み」の概念のもとになった生体構造。`,f:["ニューロン同士の接合部、信号を伝える","人工ニューラルネットワークの「重み」の着想元"]},
{t:"人工ニューロン（ノード）",c:1,g:"ニューラルネットワークの仕組み",d:`生物のニューロンの働きを数理的に模倣した計算単位。複数の入力に重みを掛けて合計し、活性化関数を通して出力するニューラルネットワークの構成要素。`,f:["入力×重みの総和を活性化関数に通す計算単位","ニューラルネットワークの最小構成要素"]},
{t:"ニューラルネットワーク",c:1,g:"ニューラルネットワークの仕組み",d:`人工ニューロンを層状に結合して構成される計算モデル。人間の脳神経回路を模したしくみで、パターン認識や予測など幅広いタスクに用いられる。`,f:["人工ニューロンを層状に接続した計算モデル","入力層・隠れ層・出力層で構成される"]},
{t:"ディープラーニング",c:1,g:"ニューラルネットワークの仕組み",d:`多層のニューラルネットワークを用いる機械学習の手法。層を深くすることで複雑な特徴を自動的に学習でき、画像認識や自然言語処理などで高い性能を発揮する。`,f:["多層（深層）のニューラルネットワークを用いる手法","第三次AIブームの中心技術","画像認識・自然言語処理・生成AIなどに応用"]},
{t:"重み",c:1,g:"ニューラルネットワークの仕組み",d:`ニューラルネットワークにおいて、各入力信号の重要度を表すパラメータ。学習によって値が調整され、出力結果に影響を与える。`,f:["各入力信号の重要度を表す数値パラメータ","学習の過程で値が更新される"]},
{t:"情報の重みづけ",c:1,g:"ニューラルネットワークの仕組み",d:`入力される情報や特徴量に対して、出力への影響度合いを数値（重み）として割り当てる考え方。ニューラルネットワークの学習の中核をなす。`,f:["出力への影響度を数値（重み）で表す考え方","ニューラルネットワークの学習の核心をなす"]},
{t:"過学習",c:1,g:"学習の課題と工夫",d:`訓練データに対して過度に適合してしまい、未知のデータに対する汎化性能が低下してしまう現象。オーバーフィッティングとも呼ばれる。`,f:["オーバーフィッティングとも呼ばれる","訓練データへの適合しすぎで汎化性能が低下","対策：正則化・ドロップアウト・データ拡張"]},
{t:"正則化",c:1,g:"学習の課題と工夫",d:`モデルが訓練データに過剰適合するのを防ぐため、パラメータの大きさに制約を加えるなどしてモデルの複雑さを抑制する手法の総称。`,f:["モデルの複雑さを抑える手法の総称","過学習の防止が目的"]},
{t:"ドロップアウト",c:1,g:"学習の課題と工夫",d:`ニューラルネットワークの学習時に、一部のノードをランダムに無効化することで過学習を防ぐ正則化手法の一つ。`,f:["学習時に一部ノードをランダムに無効化する手法","正則化手法の代表例の一つ"]},
{t:"転移学習",c:1,g:"学習の課題と工夫",d:`あるタスクで学習済みのモデルの知識を、別の関連するタスクに再利用して学習効率や性能を高める手法。少ないデータでの学習に有効。`,f:["学習済みモデルの知識を別タスクに再利用","少ないデータでの学習に有効"]},
{t:"特徴量",c:1,g:"学習の課題と工夫",d:`データが持つ性質や特性を数値などで表現した変数。機械学習モデルの入力として用いられ、予測精度に大きく影響する。`,f:["データの性質を数値などで表した変数","予測精度に直結する重要な要素"]},
{t:"弱いAI（ANI）",c:1,g:"AIの分類",d:`特定のタスクや領域に限定して人間並み、あるいはそれ以上の性能を発揮するAI。現在実用化されているAIの多くはこの弱いAI（特化型AI）に分類される。`,f:["特定タスクに特化したAI","現在実用化されているAIのほとんどが該当"]},
{t:"強いAI（AGI）",c:1,g:"AIの分類",d:`特定分野に限定されず、人間のようにあらゆる知的タスクを汎用的にこなせるとされる仮説上のAI。汎用人工知能とも呼ばれ、現時点では実現していない。`,f:["あらゆる知的タスクをこなす汎用AI","現時点では未実現の仮説的な概念"]},
{t:"第一次AIブーム",c:1,g:"AIの歴史",d:`1950～60年代に起きたAI研究の盛り上がり。探索や推論による問題解決が中心だったが、複雑な現実問題には対応できず後に停滞した。`,f:["1950〜60年代に発生","探索と推論による問題解決が中心","複雑な現実問題（トイ・プロブレム批判）に対応できず停滞"]},
{t:"探索",c:1,g:"AIの歴史",d:`目標状態に到達するために、可能な選択肢の中から手順や解を体系的に調べていく問題解決の基本手法。初期AI研究の中心技術の一つ。`,f:["選択肢を体系的にたどり解を見つける手法","迷路やパズルの解法などが典型例"]},
{t:"推論",c:1,g:"AIの歴史",d:`既知の情報や規則をもとに、新たな結論や判断を導き出す処理。AIにおいては論理的なルールに基づいて答えを導く手法として研究された。`,f:["既知の情報や規則から結論を導く処理","ルールベースAIの中核処理"]},
{t:"第二次AIブーム",c:1,g:"AIの歴史",d:`1980年代に起きたAI研究の盛り上がり。専門知識をルール化するエキスパートシステムが実用化された一方、知識獲得の限界などから再び停滞した。`,f:["1980年代に発生","エキスパートシステムが実用化された","知識獲得のボトルネックにより停滞"]},
{t:"エキスパートシステム",c:1,g:"AIの歴史",d:`特定分野の専門家の知識をルールとしてコンピュータに組み込み、専門家のような判断や助言を行えるようにしたシステム。第二次AIブームの中心技術。`,f:["専門家の知識をルール化したシステム","第二次AIブームの代表技術","例：医療診断支援システムMYCIN"]},
{t:"AIの冬",c:1,g:"AIの歴史",d:`AI研究への期待が過熱した後、技術的限界や実用化の壁に直面して研究資金や関心が急激に減少する停滞期のこと。過去に複数回発生している。`,f:["期待の過熱後に資金・関心が急減する停滞期","過去に複数回（第一次・第二次ブーム後など）発生"]},
{t:"第三次AIブーム",c:1,g:"AIの歴史",d:`2000年代以降、ビッグデータと計算資源の向上を背景にディープラーニングが発展したことで起きたAI研究・実用化の盛り上がり。現在も継続している。`,f:["2000年代以降、現在も継続中","ビッグデータ・計算資源・ディープラーニングが背景"]},
{t:"ビッグデータ",c:1,g:"AIの歴史",d:`従来の手法では処理が難しいほど巨大で多様、かつ高速に生成されるデータ群。ディープラーニングの発展を支えた重要な要素の一つ。`,f:["巨大・多様・高速に生成されるデータ群","ディープラーニングの発展を支えた要素"]},
{t:"シンギュラリティ（技術的特異点）",c:1,g:"シンギュラリティ",d:`AIの知能が人間の知能を超え、技術の進歩が人間の予測や制御を超えて加速度的に進む仮説上の転換点のこと。`,f:["AIが人間の知能を超える仮説上の転換点","予測や制御を超えて技術が加速度的に進む状態"]},
{t:"ヴァーナー・ヴィンジ",c:1,g:"シンギュラリティ",d:`「シンギュラリティ」という概念を1993年の論文で広めた米国のSF作家・数学者。技術的特異点の到来を予測したことで知られる。`,f:["米国のSF作家・数学者","1993年の論文でシンギュラリティ概念を広めた"]},
{t:"レイ・カーツワイル",c:1,g:"シンギュラリティ",d:`AIの技術的特異点が2045年頃に到来すると予測した米国の未来学者・発明家。著書「シンギュラリティは近い」などで知られる。`,f:["米国の未来学者・発明家","著書『シンギュラリティは近い』で知られる","2045年問題を提唱"]},
{t:"2045年問題",c:1,g:"シンギュラリティ",d:`レイ・カーツワイルらが提唱した、AIの能力が2045年頃に人類全体の知能を超えるとされる仮説とそれに伴う社会的影響への懸念。`,f:["AIが人類全体の知能を超えるとされる仮説","レイ・カーツワイルが2045年頃と提唱"]},
{t:"AI効果",c:1,g:"シンギュラリティ",d:`AIが新しい課題を達成すると、それが「単なる自動化・計算にすぎない」とみなされ、知能とは呼ばれなくなっていく心理的傾向のこと。`,f:["「できると知能と呼ばれなくなる」心理的傾向","AIの定義があいまいになる一因"]},

// ===== 第2章 生成AI（ジェネレーティブAI） =====
{t:"生成AI（ジェネレーティブAI）",c:2,g:"生成AIの基礎",d:`学習したデータのパターンをもとに、テキスト・画像・音声・動画など新しいコンテンツを自ら生成できるAI技術の総称。`,f:["新しいコンテンツを生み出す点が識別系AIと異なる","テキスト・画像・音声・動画など多様な出力形式に対応"]},
{t:"ボルツマンマシン",c:2,g:"生成モデルの基礎技術",d:`確率的に動作するニューラルネットワークの一種で、ノード間の結合状態からデータの確率分布を学習するモデル。生成モデルの基礎技術の一つ。`,f:["確率的に動作するニューラルネットワーク","生成モデルの基礎技術の一つ"]},
{t:"制約付きボルツマンマシン",c:2,g:"生成モデルの基礎技術",d:`ボルツマンマシンの層間結合のみを許し、同一層内の結合を無くすことで学習を効率化したモデル。特徴抽出や生成モデルの基礎に用いられた。`,f:["層内結合を無くし学習を効率化したモデル","特徴抽出や生成モデルの基礎として利用された"]},
{t:"自己回帰モデル",c:2,g:"生成モデルの基礎技術",d:`これまでに生成した過去のデータ（系列）をもとに、次の値を予測・生成していく手法。文章生成などで一語ずつ次を予測する仕組みに用いられる。`,f:["過去の出力から次の値を予測・生成する仕組み","GPTなど文章生成の基本原理"]},
{t:"CNN（畳み込みニューラルネットワーク）",c:2,g:"画像生成技術",d:`畳み込み処理により画像の局所的な特徴を抽出するニューラルネットワーク。画像認識・画像生成など画像分野で広く使われる。`,f:["画像の局所特徴を抽出するニューラルネットワーク","画像認識・画像生成分野で広く利用"]},
{t:"畳み込み",c:2,g:"画像生成技術",d:`画像などのデータにフィルタ（カーネル）を適用し、局所的な特徴（エッジや模様など）を抽出する演算処理。CNNの中心的な仕組み。`,f:["フィルタ（カーネル）で局所特徴を抽出する演算","CNNの中心的な仕組み"]},
{t:"VAE（変分自己符号化器）",c:2,g:"画像生成技術",d:`データを潜在空間に圧縮するエンコーダと、そこから元のようなデータを復元するデコーダを組み合わせ、新しいデータを生成できるモデル。`,f:["エンコーダとデコーダで構成される生成モデル","潜在空間からデータを生成する"]},
{t:"ノイズ",c:2,g:"画像生成技術",d:`データに混入する不要な変動や乱れのこと。画像生成AIの拡散モデルなどでは、意図的にノイズを加えてから除去する過程で新しい画像を生成する。`,f:["データに混入する不要な変動・乱れ","拡散モデルではノイズの付加・除去を利用して画像生成"]},
{t:"エンコーダ",c:2,g:"画像生成技術",d:`入力データを、より低次元で本質的な特徴を表す潜在表現（ベクトル）に変換する処理・機構。VAEやTransformerなどで用いられる。`,f:["入力を潜在表現（ベクトル）に変換する機構","VAEやTransformerで利用される"]},
{t:"デコーダ",c:2,g:"画像生成技術",d:`潜在表現やエンコーダの出力から、元のデータに近い形式のデータや目的の出力データを復元・生成する処理・機構。`,f:["潜在表現から元データや目的データを復元・生成","エンコーダと対をなす構成要素"]},
{t:"潜在ベクトル",c:2,g:"画像生成技術",d:`データの本質的な特徴を圧縮して表現した、低次元の数値ベクトル。VAEなどのエンコーダによって生成され、デコーダでの復元・生成に使われる。`,f:["データの本質的特徴を圧縮した低次元ベクトル","デコーダでの復元・生成に使われる"]},
{t:"GAN（敵対的生成ネットワーク）",c:2,g:"画像生成技術",d:`生成器と識別器という2つのネットワークを競わせるように学習させ、本物に近いデータを生成できるようにする生成モデルの手法。`,f:["生成器と識別器を競わせて学習する仕組み","2014年にイアン・グッドフェローらが提唱"]},
{t:"生成器",c:2,g:"画像生成技術",d:`GANにおいて、乱数などから本物に似せた偽のデータを作り出すネットワーク。識別器を騙せるように学習が進められる。`,f:["GANの構成要素、偽データを作り出す側","識別器を欺くように学習が進む"]},
{t:"識別器",c:2,g:"画像生成技術",d:`GANにおいて、入力されたデータが本物か生成器が作った偽物かを判定するネットワーク。生成器と競い合うように学習される。`,f:["GANの構成要素、本物か偽物かを判定する側","生成器と敵対的に学習が進む"]},
{t:"RNN（回帰型ニューラルネットワーク）",c:2,g:"系列データ処理技術",d:`過去の出力を次の入力に再帰的に利用することで、時系列や文章などの順序を持つデータを扱えるニューラルネットワーク。`,f:["出力を再帰的に次の入力へ利用する構造","系列データ（時系列・文章）の処理に向く"]},
{t:"隠れ層",c:2,g:"系列データ処理技術",d:`入力層と出力層の間に存在し、データの特徴を段階的に変換・抽出する層。ニューラルネットワークの中間的な処理を担う。`,f:["入力層と出力層の間に位置する層","特徴を段階的に変換・抽出する"]},
{t:"リカレント層",c:2,g:"系列データ処理技術",d:`RNNにおいて、過去の情報（内部状態）を保持しながら次の入力を処理する層。系列データの文脈を捉えるために用いられる。`,f:["過去の内部状態を保持しながら処理する層","RNNが文脈を捉えるための仕組み"]},
{t:"シーケンスデータ",c:2,g:"系列データ処理技術",d:`文章、音声、時系列データなど、要素の並び順に意味を持つデータのこと。RNNやTransformerなどが扱いを得意とする。`,f:["順序に意味を持つデータ","例：文章、音声、時系列データ"]},
{t:"LSTM（長・短期記憶）",c:2,g:"系列データ処理技術",d:`RNNの一種で、ゲート構造により長期的な情報も忘れずに保持できるよう改良されたモデル。長い系列データの学習における勾配消失問題を緩和する。`,f:["RNNの拡張版、ゲート構造を持つ","勾配消失問題を緩和し長い系列を扱える"]},
{t:"Transformerモデル",c:2,g:"Transformer",d:`Attention機構を中心に構成され、再帰構造を用いずに系列データを並列処理できるニューラルネットワークの構造。現在の大規模言語モデルの基盤技術。`,f:["Attention機構が中心、再帰構造を持たない","並列処理が可能で学習が高速","2017年Google論文『Attention Is All You Need』で提案"]},
{t:"Attention層",c:2,g:"Transformer",d:`入力データの各要素間の関連度を計算し、重要な部分に重みを付けて処理するTransformerの中核となる層。`,f:["要素間の関連度を計算し重みを付ける層","Transformerの中核をなす"]},
{t:"自己注意力（Self-Attention）",c:2,g:"Transformer",d:`系列データ内の各要素同士の関連度を計算し、文脈に応じて重要な要素に注目する仕組み。Transformerの中核的な技術。`,f:["系列内の要素同士の関連度を計算する仕組み","文脈に応じて重要な要素に注目できる"]},
{t:"Attention Mechanism",c:2,g:"Transformer",d:`入力の各部分に異なる重要度（重み）を割り当てて処理する仕組みの総称。どの情報に注目すべきかをモデルが学習できるようにする。`,f:["重要な情報に重みを割り当てる仕組みの総称","どこに注目すべきかをモデル自身が学習する"]},
{t:"位置エンコーディング",c:2,g:"Transformer",d:`Transformerにおいて、単語の並び順（位置情報）をモデルに認識させるために入力に付加される情報。再帰構造を持たないため必要となる。`,f:["単語の並び順（位置情報）を付加する仕組み","Transformerが再帰構造を持たないため必要"]},
{t:"アーキテクチャ",c:2,g:"Transformer",d:`ニューラルネットワークなどのモデルにおける、層の構成や接続方法といった全体的な設計・構造のこと。`,f:["モデルの層構成・接続方法などの設計","Transformer・CNN・RNNなど種類は多様"]},
{t:"GPTモデル",c:2,g:"GPTの発展",d:`Generative Pre-trained Transformerの略で、Transformerを用いて大量のテキストで事前学習された生成型の言語モデル。OpenAIが開発した。`,f:["Generative Pre-trained Transformerの略","OpenAIが開発","事前学習＋ファインチューニングの二段階構成"]},
{t:"OpenAI",c:2,g:"GPTの発展",d:`GPTシリーズやChatGPTなどを開発した米国のAI研究・開発企業。安全で有益なAIの実現を目指すことを掲げている。`,f:["GPTシリーズ・ChatGPTを開発する米国企業","安全で有益なAIの実現を掲げる"]},
{t:"BERTモデル",c:2,g:"BERTの発展",d:`Googleが開発した、文章を双方向（前後両方の文脈）から理解する事前学習済み言語モデル。文章理解タスクで高い性能を発揮する。`,f:["Googleが開発した言語モデル","文章を双方向（前後の文脈）から理解する","MLM・NSPで事前学習される"]},
{t:"MLM（Masked Language Model）",c:2,g:"BERTの発展",d:`文章中の一部の単語をマスク（隠す）し、周囲の文脈からその単語を予測させることで学習を行う手法。BERTの事前学習に用いられる。`,f:["単語をマスクし周囲の文脈から予測させる手法","BERTの事前学習の中核"]},
{t:"NSP（Next Sentence Prediction）",c:2,g:"BERTの発展",d:`2つの文が連続する文かどうかを判定させることで、文と文の関係性を学習させるBERTの事前学習手法の一つ。`,f:["2文が連続するかを判定させる手法","BERTの事前学習手法の一つ"]},
{t:"RoBERTa",c:2,g:"BERTの発展",d:`BERTの学習方法を改良し、より大規模なデータと長時間の学習によって性能を向上させた言語モデル。Facebook（Meta）が開発した。`,f:["BERTの改良版","より大規模なデータ・長時間学習で性能向上","Facebook（Meta）が開発"]},
{t:"ALBERT（a Lite BERT）",c:2,g:"BERTの発展",d:`BERTのパラメータ数を削減し、軽量化と学習効率の向上を図った派生モデル。パラメータ共有などの工夫により性能を保ちつつ軽量化を実現した。`,f:["BERTの軽量版","パラメータ共有で軽量化・効率化を実現"]},
{t:"ChatGPT",c:2,g:"ChatGPTとGPTシリーズ",d:`OpenAIが開発した、GPTモデルをベースに対話形式でやり取りできるように調整された生成AIサービス。自然な会話や文章生成が可能。`,f:["OpenAIが開発した対話型生成AIサービス","GPTモデルをベースに対話向けに調整"]},
{t:"GPT-1",c:2,g:"ChatGPTとGPTシリーズ",d:`OpenAIが2018年に発表した最初のGPTモデル。Transformerを用いた事前学習とファインチューニングの組み合わせによる有効性を示した。`,f:["OpenAI最初のGPTモデル（2018年）","Transformer＋事前学習の有効性を実証"]},
{t:"自然言語処理（NLP）",c:2,g:"ChatGPTとGPTシリーズ",d:`人間が日常的に使う言語（自然言語）をコンピュータに理解・生成・処理させるための技術分野の総称。`,f:["人間の言語をコンピュータで処理する技術分野","機械翻訳・感情分析・要約などが含まれる"]},
{t:"GPT-2",c:2,g:"ChatGPTとGPTシリーズ",d:`OpenAIが2019年に発表したGPTモデルの後継。パラメータ数を大幅に増やし、より自然で高品質な文章生成能力を示した。`,f:["GPT-1の後継（2019年）","パラメータ数の増加で文章生成能力が向上"]},
{t:"パラメータ",c:2,g:"ChatGPTとGPTシリーズ",d:`ニューラルネットワークの学習によって調整される重みなどの数値のこと。一般にパラメータ数が多いほどモデルの表現力は高くなる傾向がある。`,f:["学習で調整される重みなどの数値","一般に数が多いほど表現力が高くなる傾向"]},
{t:"GPT-3",c:2,g:"ChatGPTとGPTシリーズ",d:`OpenAIが2020年に発表したGPTモデル。パラメータ数を約1750億に拡大し、Few-Shot学習など高い汎用性を示したことで注目された。`,f:["2020年発表、パラメータ数は約1750億","Few-Shot学習の高い汎用性で注目された"]},
{t:"InstructGPT",c:2,g:"ChatGPTとGPTシリーズ",d:`GPT-3をベースに、人間のフィードバックを用いた強化学習（RLHF）によって、指示に従いやすいよう調整されたモデル。ChatGPTの基盤技術の一つ。`,f:["GPT-3をRLHFで指示追従性を高めたモデル","ChatGPTの基盤技術の一つ"]},
{t:"GPT-3.5",c:2,g:"ChatGPTとGPTシリーズ",d:`GPT-3をベースにファインチューニングなどの改良を加えたモデル群。初期のChatGPTに採用されたことで広く知られるようになった。`,f:["GPT-3の改良版","初期のChatGPTに採用された"]},
{t:"GPT-4",c:2,g:"ChatGPTとGPTシリーズ",d:`OpenAIが2023年に発表したGPTモデル。テキストに加え画像入力にも対応するなど、従来モデルより高い精度と汎用性を持つとされる。`,f:["2023年発表","テキストに加え画像入力にも対応（マルチモーダル）"]},
{t:"データセット",c:2,g:"ChatGPTとGPTシリーズ",d:`機械学習モデルの学習や評価に用いられる、まとまったデータの集合。データの質と量がモデルの性能に大きく影響する。`,f:["学習・評価に用いるデータの集合","質と量がモデルの性能を左右する"]},
{t:"GPT-o1",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが発表した、複雑な推論に特化したモデル（oシリーズ）。回答前に内部で段階的な思考過程を経ることで、数学やコーディングなど高度な推論を要するタスクの精度向上を図っている。`,f:["回答前に内部で段階的に考える『推論時思考』が特徴","数学・コーディングなど複雑な問題に強い","応答生成に時間がかかる傾向がある"]},
{t:"GPT-o3",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが発表した、o1の後継にあたる推論特化モデル。科学・数学・プログラミングなど、より難度の高い推論タスクへの対応力向上を目指して開発されたとされる。`,f:["o1の後継にあたる推論特化モデル","科学・数学・プログラミングでの高難度タスクに対応","ツール活用と組み合わせた推論を志向"]},
{t:"GPT-o4",c:2,g:"生成AIモデルの最新動向",d:`OpenAIのoシリーズ（推論特化型モデル）に連なるモデルとして言及される名称。o1・o3に続く世代として、推論能力の向上や外部ツールとの連携強化が図られているとされる。`,f:["oシリーズの後継として言及される名称","推論能力とツール連携の強化が図られているとされる"]},
{t:"GPT-4.1",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが発表したGPTシリーズのモデル。従来モデルと比べて、コーディングや長文の指示理解などの精度向上が図られているとされる。`,f:["GPT-4oの後継として位置づけられる","コーディングや長文の指示理解の精度が向上"]},
{t:"GPT-5",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが発表したGPTシリーズの新しい世代のモデル。従来モデルより高い推論能力や汎用性を備えるとされ、対話・コーディング・マルチモーダル処理などの性能向上が図られている。`,f:["GPTシリーズの新しい世代のモデル","推論力・汎用性・マルチモーダル対応が強化"]},
{t:"Operator",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが発表した、Webブラウザを操作してオンライン上のタスクを代行するAIエージェント型の機能・サービス。フォーム入力や予約などの操作を自動で行うことを目指す。`,f:["Webブラウザを自律的に操作するAIエージェント機能","フォーム入力や予約などの代行を想定"]},
{t:"Codex",c:2,g:"生成AIモデルの最新動向",d:`OpenAIが提供する、プログラミングやコード生成に特化したAIツール（コーディングエージェント）。自然言語による指示からコードの作成・修正・実行を行える。`,f:["コーディングに特化したAIエージェント・ツール","自然言語の指示からコード生成・修正・実行が可能"]},
{t:"Image Generation",c:2,g:"生成AIモデルの最新動向",d:`ChatGPTなどに統合された画像生成機能のこと。テキストによる指示から画像を生成でき、対話を重ねながら細部を修正していける点が特徴とされる。`,f:["ChatGPTなどに統合された画像生成機能","対話を重ねながら細部を修正できる点が特徴"]},
{t:"Gemini",c:2,g:"生成AIモデルの最新動向",d:`Googleが開発する生成AI（マルチモーダルAI）のモデル・サービス。テキストに加え画像や音声など複数の形式を扱えることや、Googleの各種サービスとの連携が特徴とされる。`,f:["Googleが開発するマルチモーダルAI","検索やGoogle Workspaceなど自社サービスと連携"]},
{t:"Claude",c:2,g:"生成AIモデルの最新動向",d:`Anthropicが開発する生成AI（対話型AI）のモデル・サービス。安全性への配慮や長い文脈の処理を重視した設計が特徴とされる。`,f:["Anthropicが開発する対話型生成AI","安全性重視の設計思想と長文脈処理が特徴とされる"]},
{t:"Copilot",c:2,g:"生成AIモデルの最新動向",d:`Microsoftが提供する、生成AIを活用したアシスタントサービス。Word・ExcelなどのMicrosoft 365製品や検索、開発環境などに組み込まれ、作業支援を行う。`,f:["Microsoftが提供するAIアシスタント","Word・ExcelなどMicrosoft 365製品に統合"]},
{t:"RAG（検索拡張生成）",c:2,g:"RAG（検索拡張生成）",d:`生成AIが回答を作成する際に、外部の文書やデータベースから関連情報を検索して参照させたうえで生成させる手法。ハルシネーションの抑制や最新情報への対応力向上を目的とする。`,f:["生成前に外部情報を検索し根拠づける手法","ハルシネーション抑制・最新情報対応が目的","基本フロー：チャンク化→埋め込み→ベクトルDB検索→生成"]},
{t:"チャンク",c:2,g:"RAG（検索拡張生成）",d:`RAGなどにおいて、文書データをAIが検索・処理しやすいよう、意味のまとまりを保った小さな単位に分割したもの。またその分割処理のこと。`,f:["文書を検索・処理しやすい単位に分割したもの","分割の粒度が検索精度に影響する"]},
{t:"埋め込み（Embedding）",c:2,g:"RAG（検索拡張生成）",d:`テキストなどのデータを、意味の近さを数値的に表現した多次元のベクトルに変換する処理・技術。RAGにおける関連情報の検索などに利用される。`,f:["テキストを意味の近さを表す数値ベクトルに変換する処理","類似する意味の語は近いベクトルになる"]},
{t:"ベクトルDB",c:2,g:"RAG（検索拡張生成）",d:`埋め込みによって数値化されたベクトルデータを保存し、意味的に類似する情報を高速に検索できるようにしたデータベース。RAGの仕組みを支える基盤技術の一つ。`,f:["ベクトル化データを保存・高速検索するデータベース","意味的な類似検索（近傍探索）に強い"]},
{t:"AIエージェント",c:2,g:"AIエージェント",d:`与えられた目的に対して、AI自らが計画を立て、外部のツールやサービスと連携しながら実行・観察を繰り返し、タスクを自律的に遂行する仕組みやAIのこと。`,f:["計画→実行→観察のループでタスクを遂行","外部ツールやサービスと連携して自律的に行動"]},
{t:"MCP（Model Context Protocol）",c:2,g:"AIエージェント",d:`AIモデルが外部のデータソースやツールと連携するための標準化された接続方式（プロトコル）。Anthropicが提唱し、AIエージェントの開発などで利用が広がっている。`,f:["AIと外部ツール・データソースをつなぐ標準規格","Anthropicが提唱し利用が広がっている"]},
{t:"RLHF（Reinforcement Learning from Human Feedback）",c:2,g:"学習の調整技術",d:`人間の評価・フィードバックを報酬として利用し、強化学習によってモデルの出力を人間の意図に沿うよう調整する手法。`,f:["人間の評価を報酬として強化学習を行う手法","InstructGPTやChatGPTなどで採用"]},
{t:"アライメント（Alignment）",c:2,g:"学習の調整技術",d:`AIの振る舞いや出力を、人間の意図や価値観、倫理観に沿うように調整すること。安全で有用なAIを実現するための重要な課題。`,f:["AIの出力を人間の意図・価値観に合わせる取り組み","安全なAI実現のための重要課題"]},
{t:"ファインチューニング",c:2,g:"学習の調整技術",d:`事前学習済みのモデルに対し、特定のタスクや用途に合わせた追加データで再学習を行い、性能を最適化する手法。`,f:["事前学習済みモデルを追加データで再学習する手法","特定タスクへの最適化に用いる"]},
{t:"ハルシネーション（Hallucination）",c:2,g:"学習の調整技術",d:`生成AIが、事実に基づかない誤った情報や存在しない内容を、あたかも真実であるかのように出力してしまう現象。`,f:["事実に基づかない情報をもっともらしく出力する現象","RAGなどが対策技術として用いられる"]},
{t:"マルチモーダル",c:2,g:"学習の調整技術",d:`テキスト・画像・音声・動画など、複数の種類（モダリティ）の情報を組み合わせて処理・生成できる能力や、そのようなAIモデルのこと。`,f:["テキスト・画像・音声など複数形式を扱う能力","GPT-4やGeminiなどが代表例"]},

// ===== 第3章 現在の生成AIの動向 =====
{t:"テキスト生成AI",c:3,g:"生成AIの種類",d:`入力された文章やプロンプトに応じて、自然な文章を自動的に生成するAI。ChatGPTなどが代表例で、文章作成や要約、翻訳などに活用される。`,f:["文章の生成・要約・翻訳などに対応","代表例：ChatGPT、Claude、Gemini"]},
{t:"画像生成AI",c:3,g:"生成AIの種類",d:`テキストによる指示（プロンプト）などをもとに、新しい画像を自動的に生成するAI。GANや拡散モデルなどの技術が用いられる。`,f:["テキスト指示から画像を生成する","GANや拡散モデルなどの技術が用いられる"]},
{t:"音楽生成AI",c:3,g:"生成AIの種類",d:`メロディや歌詞、雰囲気などの指示をもとに、新しい楽曲やBGMを自動的に作曲・生成するAI。作曲支援や制作の効率化に活用される。`,f:["メロディや歌詞、雰囲気の指示から楽曲を生成","作曲支援や制作の効率化に活用"]},
{t:"音声生成AI",c:3,g:"生成AIの種類",d:`テキストから自然な音声を合成したり、特定の声質を再現したりするAI。ナレーション生成や音声アシスタントなどに活用される。`,f:["テキストからの音声合成や声質の再現が可能","ナレーションや音声アシスタントに活用"]},
{t:"動画生成AI",c:3,g:"生成AIの種類",d:`テキストや画像などの指示をもとに、新しい動画コンテンツを自動的に生成するAI。近年急速に発展している生成AIの一分野。`,f:["テキストや画像の指示から動画を生成","近年急速に発展している分野"]},
{t:"Sora",c:3,g:"動画生成AIの代表的なツール",d:`OpenAIが開発した動画生成AIモデル。テキストによる指示から、比較的長尺かつ高品質な動画を生成できる点が特徴とされる。`,f:["OpenAIが開発した動画生成AIモデル","高品質・比較的長尺な動画生成が特徴"]},
{t:"Runway Gen-3",c:3,g:"動画生成AIの代表的なツール",d:`Runway社が開発する動画生成AIモデル。テキストや画像の指示から映像を生成できるツールとして、映像制作分野などで利用されている。`,f:["Runway社の動画生成AIモデル","映像制作・クリエイティブ分野で活用"]},
{t:"Luma Dream Machine",c:3,g:"動画生成AIの代表的なツール",d:`Luma AI社が提供する動画生成AIツール。テキストや画像から短い動画クリップを生成できるサービスとして知られる。`,f:["Luma AI社の動画生成AIツール","短い動画クリップの生成に強み"]},
{t:"Veo3",c:3,g:"動画生成AIの代表的なツール",d:`Googleが開発する動画生成AIモデル。テキストなどの指示から動画を生成する技術で、音声を伴う動画を生成できる点なども特徴とされる。`,f:["Googleの動画生成AIモデル","音声を伴う動画生成に対応する点が特徴"]},
{t:"画像のリサイズ",c:3,g:"データ処理技術",d:`画像生成AIにおいて、生成前後に画像の縦横サイズを調整する処理。学習データの統一やモデルの入出力形式に合わせるために行われる。`,f:["画像の縦横サイズを調整する処理","学習データの統一やモデル入出力形式への対応が目的"]},
{t:"正規化",c:3,g:"データ処理技術",d:`データの値の範囲やスケールを一定の基準に揃える前処理。学習を安定させ、モデルの精度や収束速度を高めるために行われる。`,f:["データの値の範囲・スケールを揃える前処理","学習の安定化や収束速度の向上に寄与"]},
{t:"データの水増し（augmentation）",c:3,g:"データ処理技術",d:`既存のデータに回転・反転・拡大縮小などの加工を施し、データ量を人工的に増やす手法。過学習の抑制や汎化性能の向上に役立つ。`,f:["回転・反転・拡大縮小などでデータ量を増やす手法","過学習の抑制や汎化性能の向上に役立つ"]},
{t:"データ拡張技術",c:3,g:"データ処理技術",d:`学習データの多様性を増やすための技術の総称。少ないデータでも高い性能を得られるようにする工夫として用いられる。`,f:["学習データの多様性を増やす技術の総称","少ないデータでも高い性能を得やすくする"]},
{t:"リマスタリング",c:3,g:"データ処理技術",d:`既存の音声・映像・画像データをAI技術などで高画質・高音質に修復・再構成する処理。古い作品の品質向上などに活用される。`,f:["既存データをAI技術で高画質・高音質に修復","古い作品の品質向上などに活用"]},
{t:"ユーザーエクスペリエンス",c:3,g:"データ処理技術",d:`製品やサービスを利用する際にユーザーが得る体験や満足度のこと。生成AIの活用ではUXの向上が重要な目的の一つとなる。`,f:["利用時にユーザーが得る体験・満足度","生成AI活用ではUX向上が重要な目的の一つ"]},
{t:"ディープフェイク（深層偽造）技術",c:3,g:"生成AIのリスク",d:`ディープラーニングを用いて、実在の人物の顔や声を精巧に合成・改変し、本物と見分けがつきにくい偽の映像や音声を作る技術。`,f:["実在人物の顔・声を精巧に合成・改変する技術","悪用による誤情報拡散などのリスクが指摘される"]},
{t:"偽情報（ディスインフォメーション）",c:3,g:"生成AIのリスク",d:`意図的に人を欺くために作成・拡散される虚偽の情報。生成AIの悪用によって、より巧妙で大量の偽情報が作られるリスクが指摘されている。`,f:["意図的に人を欺くために作られる虚偽情報","生成AIの悪用で拡散リスクが高まっている"]},

// ===== 第4章 情報リテラシー・基本理念とAI社会原則 =====
{t:"インターネットリテラシー",c:4,g:"情報リテラシー",d:`インターネットの仕組みやリスクを理解し、情報を適切かつ安全に検索・発信・活用できる能力のこと。`,f:["インターネットの仕組みやリスクへの理解","情報の適切な検索・発信・活用能力"]},
{t:"テクノロジーの理解",c:4,g:"情報リテラシー",d:`デジタル技術やAIなどの仕組み・特性を正しく理解し、適切に活用・判断する能力のこと。情報リテラシーを構成する要素の一つ。`,f:["デジタル技術やAIの仕組み・特性の理解","情報リテラシーを構成する要素の一つ"]},
{t:"情報リテラシー",c:4,g:"情報リテラシー",d:`情報を適切に収集・分析・評価し、目的に応じて活用・発信できる能力の総称。インターネットリテラシーやセキュリティ意識なども含む広い概念。`,f:["情報の収集・分析・評価・活用・発信の能力","インターネットリテラシーなどを含む広い概念"]},
{t:"セキュリティとプライバシー",c:4,g:"情報リテラシー",d:`情報システムやデータを不正アクセス・漏えいなどの脅威から守る「セキュリティ」と、個人の情報を守る「プライバシー」への配慮の総称。`,f:["情報を脅威から守る「セキュリティ」の観点","個人情報を守る「プライバシー」の観点"]},
{t:"デジタル市民権",c:4,g:"情報リテラシー",d:`デジタル社会において、責任を持ってテクノロジーを適切かつ倫理的に利用する能力や姿勢のこと。`,f:["デジタル社会で責任ある行動をとる姿勢","テクノロジーの倫理的な利用を含む概念"]},
{t:"フィッシング詐欺",c:4,g:"サイバー攻撃の種類",d:`実在する企業などを装った偽のメールやサイトを用いて、ID・パスワードやクレジットカード情報などを不正に盗み取る詐欺の手口。`,f:["実在企業を装った偽メール・偽サイトを利用","ID・パスワードやカード情報の窃取が目的"]},
{t:"スミッシング",c:4,g:"サイバー攻撃の種類",d:`SMS（ショートメッセージ）を悪用したフィッシング詐欺。偽のリンクを送りつけ、個人情報の入力やマルウェアの実行を誘導する手口。`,f:["SMSを悪用したフィッシング詐欺","偽リンクで個人情報入力やマルウェア実行を誘導"]},
{t:"ヴィッシング",c:4,g:"サイバー攻撃の種類",d:`電話（Voice）を用いたフィッシング詐欺。金融機関や公的機関などを装って電話をかけ、個人情報や金銭をだまし取る手口。`,f:["電話（Voice）を用いたフィッシング詐欺","金融機関などを装い個人情報や金銭をだまし取る"]},
{t:"マルウェア",c:4,g:"サイバー攻撃の種類",d:`コンピュータやネットワークに害を及ぼす目的で作られた悪意のあるソフトウェアの総称。ウイルスやランサムウェアなどが含まれる。`,f:["害を及ぼす目的で作られた悪意あるソフトウェアの総称","ウイルスやランサムウェアなどを含む"]},
{t:"アンチウイルスソフトウェア",c:4,g:"サイバー攻撃の種類",d:`マルウェアの検知・駆除・感染防止を目的としたセキュリティ対策ソフトウェアのこと。`,f:["マルウェアの検知・駆除・感染防止が目的","セキュリティ対策の基本ツールの一つ"]},
{t:"クラウドストレージ",c:4,g:"サイバー攻撃の種類",d:`インターネット経由でデータを保存・共有できるオンライン上の記憶領域サービス。利便性が高い一方、適切なアクセス管理が求められる。`,f:["インターネット経由でデータを保存・共有するサービス","利便性が高い一方アクセス管理が重要"]},
{t:"ランサムウェア",c:4,g:"サイバー攻撃の種類",d:`感染した端末やデータを暗号化して使用不能にし、復旧と引き換えに金銭（身代金）を要求するマルウェアの一種。`,f:["データを暗号化し使用不能にするマルウェア","復旧と引き換えに金銭を要求する"]},
{t:"ソーシャルエンジニアリング攻撃",c:4,g:"ソーシャルエンジニアリング",d:`技術的な手段ではなく、人間の心理的な隙や不注意につけ込んで情報を盗み出したり、不正な行動を誘導したりする攻撃手法の総称。`,f:["人間の心理的な隙につけ込む攻撃手法の総称","技術的手段に頼らない点が特徴"]},
{t:"スピアフィッシング",c:4,g:"ソーシャルエンジニアリング",d:`特定の個人や組織を狙い、業務内容などに合わせた巧妙な偽メールを送りつける標的型のフィッシング攻撃。`,f:["特定の個人・組織を狙う標的型フィッシング","業務内容に合わせた巧妙な偽メールを使う"]},
{t:"ベイト攻撃",c:4,g:"ソーシャルエンジニアリング",d:`USBメモリなど魅力的な「餌（ベイト）」を仕掛け、被害者に不正なデバイスやリンクを使わせることでマルウェア感染などを誘発する攻撃手法。`,f:["USBメモリなど魅力的な『餌』を仕掛ける手法","不正なデバイスやリンクの利用を誘発する"]},
{t:"ブラックメール",c:4,g:"ソーシャルエンジニアリング",d:`不正に入手した情報や弱みを利用して相手を脅迫し、金銭の支払いなどを強要する行為。ソーシャルエンジニアリングの一手法。`,f:["弱みを利用して相手を脅迫し金銭を要求する行為","ソーシャルエンジニアリングの一手法"]},
{t:"プレテキスト",c:4,g:"ソーシャルエンジニアリング",d:`偽の状況や身分を装って相手を信用させ、本来得られないはずの情報を聞き出す手口。ソーシャルエンジニアリング攻撃の一種。`,f:["偽の身分や状況を装い信用させる手口","本来得られない情報を聞き出すことが目的"]},
{t:"個人情報保護法",c:4,g:"個人情報保護",d:`個人情報を取り扱う事業者が守るべきルールを定めた日本の法律。個人の権利利益を保護することを目的とする。`,f:["個人情報を扱う事業者が守るべきルールを定めた法律","個人の権利利益の保護が目的"]},
{t:"改正個人情報保護法",c:4,g:"個人情報保護",d:`技術の進展や社会情勢の変化に対応するため改正された個人情報保護法。要配慮個人情報や匿名加工情報の規定などが整備された。`,f:["社会情勢の変化に対応した改正法","要配慮個人情報・匿名加工情報の規定を整備"]},
{t:"個人情報保護委員会",c:4,g:"個人情報保護",d:`個人情報保護法に基づき、個人情報の適正な取り扱いを監督・指導する日本の独立した行政機関。`,f:["個人情報の適正な取り扱いを監督する行政機関","個人情報保護法に基づき設置"]},
{t:"個人情報取扱事業者",c:4,g:"個人情報保護",d:`事業活動において個人情報データベース等を利用している事業者のこと。個人情報保護法上の各種義務を負う。`,f:["個人情報データベース等を事業で利用する事業者","個人情報保護法上の各種義務を負う"]},
{t:"個人識別符号",c:4,g:"個人情報保護",d:`マイナンバーやパスポート番号、指紋データなど、それ単体で特定の個人を識別できる符号のこと。個人情報保護法で個人情報の一種として定義される。`,f:["それ単体で個人を識別できる符号","例：マイナンバー、パスポート番号、指紋データ"]},
{t:"要配慮個人情報",c:4,g:"個人情報保護",d:`人種、信条、病歴、犯罪歴など、取り扱いに特に配慮を要する個人情報のこと。取得には原則として本人の同意が必要とされる。`,f:["取り扱いに特に配慮を要する個人情報","人種・信条・病歴・犯罪歴などが該当","取得には原則本人同意が必要"]},
{t:"機微（センシティブ）情報",c:4,g:"個人情報保護",d:`本人にとって不当な差別や不利益につながるおそれのある、取り扱いに慎重を要する情報のこと。要配慮個人情報と近い概念で使われる。`,f:["不当な差別・不利益につながりうる情報","要配慮個人情報と近い概念で使われる"]},
{t:"匿名加工情報",c:4,g:"個人情報保護",d:`特定の個人を識別できないように加工し、かつ元の個人情報に復元できないようにした情報。本人同意なしで一定の範囲で利用・提供が可能。`,f:["個人を識別できないよう加工した情報","本人同意なしで一定範囲の利用・提供が可能"]},
{t:"マスキング",c:4,g:"個人情報保護",d:`個人情報や機密情報の一部を伏せ字や記号などに置き換え、本人や内容が特定できないようにする処理のこと。`,f:["個人情報等の一部を伏せ字・記号に置き換える処理","本人や内容を特定できないようにする"]},
{t:"知的財産権",c:4,g:"知的財産権",d:`発明、著作物、デザイン、商標など、人間の知的な創作活動によって生み出された成果を保護する権利の総称。`,f:["発明・著作物・デザイン・商標などを保護する権利の総称"]},
{t:"著作権",c:4,g:"知的財産権",d:`小説、音楽、プログラムなど、創作的な表現物（著作物）を作った人に認められる、無断利用を制限できる権利。`,f:["創作的な表現物（著作物）を保護する権利","無断利用を制限できる"]},
{t:"特許権",c:4,g:"知的財産権",d:`新しい発明について、一定期間その発明を独占的に実施できる権利。特許庁への出願・登録によって発生する。`,f:["新しい発明を独占的に実施できる権利","特許庁への出願・登録により発生"]},
{t:"商標権",c:4,g:"知的財産権",d:`商品やサービスを他者のものと区別するためのマーク（商標）を、独占的に使用できる権利。登録によって発生する。`,f:["商品・サービスを区別するマークを独占使用できる権利","登録により発生"]},
{t:"意匠権",c:4,g:"知的財産権",d:`物品や画像などのデザイン（意匠）を保護し、独占的に実施できる権利。登録によって発生する。`,f:["物品や画像などのデザインを保護する権利","登録により発生"]},
{t:"肖像権",c:4,g:"知的財産権",d:`本人の承諾なく、みだりに容貌や姿を撮影・公表・利用されない権利。法律に明文規定はないが、判例上認められている人格権の一種。`,f:["容貌や姿を無断で撮影・公表されない権利","判例上認められる人格権の一種、明文規定はない"]},
{t:"パブリシティ権",c:4,g:"知的財産権",d:`著名人の氏名や肖像などが持つ顧客誘引力（経済的価値）を、本人が独占的に利用できる権利。`,f:["著名人の氏名・肖像の経済的価値を独占利用できる権利"]},
{t:"不正競争防止法",c:4,g:"知的財産権",d:`営業秘密の侵害や不正な模倣など、公正な競争を阻害する行為を規制し、事業者の利益を保護する日本の法律。`,f:["公正な競争を阻害する行為を規制する法律","営業秘密の侵害や不正模倣などを規制"]},
{t:"営業秘密",c:4,g:"知的財産権",d:`秘密として管理され、事業活動に有用で、公然と知られていない技術上・営業上の情報のこと。不正競争防止法で保護される。`,f:["秘密管理され事業に有用な非公知の情報","不正競争防止法で保護される"]},
{t:"限定提供データ",c:4,g:"知的財産権",d:`相当量蓄積され、電磁的方法で管理された上で、特定の者に反復・継続して提供されるデータのこと。不正競争防止法の保護対象。`,f:["特定の者に反復・継続提供される蓄積データ","不正競争防止法の保護対象"]},
{t:"技術的制限手段",c:4,g:"知的財産権",d:`著作物などの不正な複製やアクセスを防ぐために施される、暗号化やコピーガードなどの技術的な保護手段のこと。`,f:["不正な複製・アクセスを防ぐ技術的な保護手段","例：暗号化、コピーガード"]},
{t:"著作権侵害",c:4,g:"知的財産権",d:`著作権者の許諾を得ずに、著作物を無断で複製、公衆送信、翻案などする行為。生成AIの利用・生成物に関しても論点となっている。`,f:["無断で著作物を複製・公衆送信・翻案する行為","生成AIの利用・生成物でも論点となる"]},
{t:"名誉毀損",c:4,g:"知的財産権",d:`事実の摘示などにより、他人の社会的評価を低下させる行為。生成AIによる誤情報の生成・拡散でも問題となり得る。`,f:["他人の社会的評価を低下させる行為","生成AIの誤情報生成・拡散でも問題となりうる"]},
{t:"AI生成物",c:4,g:"知的財産権",d:`AI（生成AI）によって作り出されたテキスト、画像、音楽、動画などの成果物のこと。著作権の帰属などが議論されている。`,f:["生成AIが作り出したテキスト・画像・音楽・動画等","著作権の帰属などが議論されている"]},
{t:"AI事業者ガイドライン",c:4,g:"AI関連の法制度・ガイドライン",d:`総務省・経済産業省が策定した、AI開発者・提供者・利用者それぞれが留意すべき事項をまとめた指針。法的拘束力を持たないソフトローとして、AIの安全・安心な活用を促す位置づけにある。`,f:["総務省・経済産業省が策定した指針","法的拘束力のないソフトロー","第1.0版から第1.1版へ改訂された"]},
{t:"AI新法",c:4,g:"AI関連の法制度・ガイドライン",d:`2025年6月に公布された、AI技術の研究開発及び活用の推進を目的とする日本の法律の通称。国全体でAI戦略を推進していくための枠組みを定めている。`,f:["2025年6月公布のAI関連技術の研究開発・活用推進法","国全体のAI戦略推進の枠組みを規定"]},
{t:"AI社会の基本理念",c:4,g:"AI社会の基本理念",d:`人間中心の考え方のもと、AIを活用して持続可能で誰もが幸せを追求できる社会を目指す、日本のAI政策の根底にある考え方。`,f:["人間中心で持続可能な社会を目指す考え方","日本のAI政策の根底にある理念"]},
{t:"人間中心のAI社会原則",c:4,g:"AI社会の基本理念",d:`内閣府が策定した、AIの利活用にあたり人間の尊厳や多様性、持続可能性を重視すべきとする基本方針の名称。`,f:["内閣府が策定した基本方針","人間の尊厳・多様性・持続可能性を重視"]},
{t:"人間の尊厳が尊重される社会（Dignity）",c:4,g:"AI社会の基本理念",d:`AIを道具として使いこなし、人間の能力を拡張することで、人間の尊厳が尊重される社会を目指すという基本理念の一つ。`,f:["AIを道具として人間の能力を拡張する考え方","基本理念の一つ"]},
{t:"多様な背景を持つ人々が多様な幸せを追求できる社会（Diversity & Inclusion）",c:4,g:"AI社会の基本理念",d:`多様な人々が、それぞれの多様な幸せを追求できる包摂的な社会をAIによって実現するという基本理念。`,f:["多様な人々が多様な幸せを追求できる包摂的社会","基本理念の一つ"]},
{t:"持続性ある社会（Sustainability）",c:4,g:"AI社会の基本理念",d:`AIの活用により、地球規模の課題解決や持続可能な社会の発展に貢献するという基本理念。`,f:["AI活用で地球規模の課題解決に貢献する考え方","基本理念の一つ"]},
{t:"AI社会原則",c:4,g:"AI社会原則",d:`「人間中心のAI社会原則」において示された、AIの開発・活用にあたり社会全体で尊重すべき7つの原則の総称。`,f:["人間中心のAI社会原則が示す7つの原則の総称"]},
{t:"人間中心の原則",c:4,g:"AI社会原則",d:`AIの利活用は人間の基本的人権を侵さず、人間中心の考え方に基づくべきとするAI社会原則の一つ。`,f:["AIは人間の基本的人権を侵さないという原則"]},
{t:"教育・リテラシーの原則",c:4,g:"AI社会原則",d:`AIを適切に利活用できるよう、幅広い層に対して教育やリテラシー向上の機会が提供されるべきとするAI社会原則の一つ。`,f:["幅広い層への教育・リテラシー向上機会の提供"]},
{t:"プライバシー確保の原則",c:4,g:"AI社会原則",d:`パーソナルデータの利用にあたり、個人の自由・尊厳・平等が侵害されないよう配慮すべきとするAI社会原則の一つ。`,f:["個人の自由・尊厳・平等を侵害しないための配慮"]},
{t:"セキュリティ確保の原則",c:4,g:"AI社会原則",d:`社会がAIの利活用にあたり正の効果を得られるよう、AIに関わる者は不断のセキュリティ意識を持つべきとするAI社会原則の一つ。`,f:["AIに関わる者が不断のセキュリティ意識を持つべきとする原則"]},
{t:"公正競争確保の原則",c:4,g:"AI社会原則",d:`特定の企業や国にAIに関する資源が過度に集中せず、公正な競争環境が維持されるべきとするAI社会原則の一つ。`,f:["AI資源が特定企業・国に過度に集中しないための原則"]},
{t:"公平性",c:4,g:"AI社会原則",d:`AIの判断や処理において、特定の属性に基づく不当な差別や偏り（バイアス）が生じないようにするという考え方。`,f:["AIの判断に不当な差別や偏り（バイアス）が生じないようにする考え方"]},
{t:"説明責任及び透明性の原則",c:4,g:"AI社会原則",d:`AIの利活用にあたり、判断過程の説明可能性を確保し、社会の信頼を醸成すべきとするAI社会原則の一つ。`,f:["判断過程の説明可能性を確保し信頼を醸成する原則"]},
{t:"イノベーションの原則",c:4,g:"AI社会原則",d:`大学と産業、異分野の連携などを通じて、絶え間ないイノベーションが生み出される環境を整備すべきとするAI社会原則の一つ。`,f:["産学連携や異分野連携でイノベーションを生む環境整備"]},
{t:"AI利活用原則の基本理念",c:4,g:"AI利活用原則",d:`総務省が示した、AIサービス提供者・利用者などが尊重すべきAI利活用に関する考え方の根底にある理念。`,f:["総務省が示すAI利活用に関する考え方の根底の理念"]},
{t:"AIネットワーク",c:4,g:"AI利活用原則",d:`AI同士が接続され、あるいはAIを介して人・モノ・情報が相互につながっているネットワーク環境のこと。`,f:["AI同士や人・モノ・情報が相互接続するネットワーク環境"]},
{t:"AI利活用原則（10の原則）",c:4,g:"AI利活用原則",d:`総務省がAI利活用に関するガイドラインで示した、適正利用や適正学習など10項目からなる利用者向けの行動指針。`,f:["総務省のガイドラインが示す10項目の行動指針"]},
{t:"適正利用の原則",c:4,g:"AI利活用原則",d:`AIの便益及びリスクについて正しく理解した上で、適正な範囲・方法で利用するよう努めるべきとするAI利活用原則の一つ。`,f:["便益とリスクを理解した適正な範囲・方法での利用"]},
{t:"適正学習の原則",c:4,g:"AI利活用原則",d:`AIに学習させるデータの質や公平性に留意し、適正な学習を行うべきとするAI利活用原則の一つ。`,f:["学習データの質・公平性に留意した適正な学習"]},
{t:"連携の原則",c:4,g:"AI利活用原則",d:`AIシステム・サービス間の連携に留意すべきとするAI利活用原則の一つ。相互接続性・相互運用性への配慮を含む。`,f:["AIシステム・サービス間の相互接続性・運用性への配慮"]},
{t:"安全の原則",c:4,g:"AI利活用原則",d:`AIの利活用にあたり、人の生命・身体・財産に危害を及ぼさないよう配慮すべきとするAI利活用原則の一つ。`,f:["人の生命・身体・財産に危害を及ぼさない配慮"]},
{t:"セキュリティの原則",c:4,g:"AI利活用原則",d:`AIの利活用にあたり、AIのセキュリティを確保するよう配慮すべきとするAI利活用原則の一つ。`,f:["AI自体のセキュリティ確保への配慮"]},
{t:"プライバシーの原則",c:4,g:"AI利活用原則",d:`AIの利活用にあたり、他者のプライバシーが侵害されないよう配慮すべきとするAI利活用原則の一つ。`,f:["他者のプライバシーを侵害しない配慮"]},
{t:"尊厳・自律の原則",c:4,g:"AI利活用原則",d:`AIの利活用にあたり、人間の尊厳と個人の自律を尊重すべきとするAI利活用原則の一つ。`,f:["人間の尊厳と個人の自律の尊重"]},
{t:"公平性の原則",c:4,g:"AI利活用原則",d:`AIの判断において、人々が不当に差別されないよう配慮すべきとするAI利活用原則の一つ。`,f:["AIの判断で人々が不当に差別されないための配慮"]},
{t:"透明性の原則",c:4,g:"AI利活用原則",d:`AIの動作の説明可能性及び検証可能性に留意すべきとするAI利活用原則の一つ。`,f:["AIの動作の説明可能性・検証可能性への留意"]},
{t:"アカウンタビリティの原則",c:4,g:"AI利活用原則",d:`利用者などがAIの利活用に伴うステークホルダーへの説明責任を果たすよう努めるべきとするAI利活用原則の一つ。`,f:["ステークホルダーへの説明責任を果たす努力"]},

// ===== 第5章 テキスト生成AIのプロンプト制作と実例 =====
{t:"LM（Language Model：言語モデル）",c:5,g:"言語モデルの基礎",d:`文章中の単語の並びに対して、次に来る単語の確率を計算するなどして、言語の統計的な特徴をモデル化した仕組み。`,f:["次に来る単語の確率を計算する仕組み","言語の統計的特徴をモデル化したもの"]},
{t:"n-gramモデル",c:5,g:"言語モデルの基礎",d:`直前のn個の単語（またはn文字）の並びから次の単語の出現確率を推定する、統計的な言語モデルの手法。`,f:["直前n個の単語の並びから次語を推定する統計的モデル","文脈を長く扱えない限界がある"]},

const LS_LEARNED = "guga-glossary-learned-v1";
const LS_THEME = "guga-glossary-theme-v1";

const state = {
  query: "",
  chapters: new Set([1,2,3,4,5]),
  sort: "chapter",
  learnedFilter: "all", // all | learned | unlearned
  learned: {},
  activeId: null,
};

function loadLearned(){
  try { return JSON.parse(localStorage.getItem(LS_LEARNED)) || {}; }
  catch(e){ return {}; }
}
function saveLearned(){
  localStorage.setItem(LS_LEARNED, JSON.stringify(state.learned));
}
state.learned = loadLearned();

// theme
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️ ライトモード" : "🌙 ダークモード";
}
(function initTheme(){
  const saved = localStorage.getItem(LS_THEME);
  const theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
})();
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem(LS_THEME, next);
});

// chapter chips
const chapterChipsEl = document.getElementById("chapterChips");
const CH_LABELS = {1:"第1章 AI", 2:"第2章 生成AI", 3:"第3章 動向", 4:"第4章 リテラシー・原則", 5:"第5章 プロンプト"};
[1,2,3,4,5].forEach(c => {
  const chip = document.createElement("label");
  chip.className = "chip active";
  chip.dataset.ch = c;
  chip.innerHTML = `<input type="checkbox" checked style="display:none;"> ${CH_LABELS[c]}`;
  chip.addEventListener("click", (e) => {
    e.preventDefault();
    if(state.chapters.has(c)){
      if(state.chapters.size === 1) return; // keep at least one
      state.chapters.delete(c);
      chip.classList.remove("active");
    } else {
      state.chapters.add(c);
      chip.classList.add("active");
    }
    render();
  });
  chapterChipsEl.appendChild(chip);
});

// sort toggle
document.getElementById("sortToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-sort]");
  if(!btn) return;
  state.sort = btn.dataset.sort;
  document.querySelectorAll("#sortToggle button").forEach(b => b.classList.toggle("active", b === btn));
  render();
});

// learned filter chips
const learnedChipEl = document.getElementById("showLearned");
const unlearnedChipEl = document.getElementById("showUnlearned");
learnedChipEl.addEventListener("click", () => {
  state.learnedFilter = state.learnedFilter === "learned" ? "all" : "learned";
  learnedChipEl.classList.toggle("active", state.learnedFilter === "learned");
  unlearnedChipEl.classList.remove("active");
  render();
});
unlearnedChipEl.addEventListener("click", () => {
  state.learnedFilter = state.learnedFilter === "unlearned" ? "all" : "unlearned";
  unlearnedChipEl.classList.toggle("active", state.learnedFilter === "unlearned");
  learnedChipEl.classList.remove("active");
  render();
});

// search
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", () => {
  state.query = searchEl.value.trim();
  render();
});

// collator for kana-ish sort
const collator = new Intl.Collator("ja-JP");

function getFiltered(){
  const q = state.query.toLowerCase();
  return TERMS
    .map((term, idx) => ({...term, id: idx}))
    .filter(term => state.chapters.has(term.c))
    .filter(term => {
      if(state.learnedFilter === "learned") return !!state.learned[term.id];
      if(state.learnedFilter === "unlearned") return !state.learned[term.id];
      return true;
    })
    .filter(term => {
      if(!q) return true;
      const fText = term.f ? term.f.join(" ").toLowerCase() : "";
      return term.t.toLowerCase().includes(q) || term.d.toLowerCase().includes(q) || term.g.toLowerCase().includes(q) || fText.includes(q);
    });
}

function getSorted(list){
  const arr = list.slice();
  if(state.sort === "kana"){
    arr.sort((a,b) => collator.compare(a.t, b.t));
  } else {
    arr.sort((a,b) => a.c - b.c || a.id - b.id);
  }
  return arr;
}

const gridEl = document.getElementById("grid");
const emptyMsgEl = document.getElementById("emptyMsg");
const countTextEl = document.getElementById("countText");
const progressFillEl = document.getElementById("progressFill");
const progressTextEl = document.getElementById("progressText");

function render(){
  const filtered = getSorted(getFiltered());
  gridEl.innerHTML = "";
  emptyMsgEl.style.display = filtered.length === 0 ? "block" : "none";

  const frag = document.createDocumentFragment();
  filtered.forEach(term => {
    const isLearned = !!state.learned[term.id];
    const card = document.createElement("div");
    card.className = "card" + (isLearned ? " learned" : "");
    card.dataset.id = term.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${escapeHtml(term.t)}</div>
        <label class="learned-toggle" data-id="${term.id}">
          <input type="checkbox" ${isLearned ? "checked" : ""}> 覚えた
        </label>
      </div>
      <span class="tag ch${term.c}">第${term.c}章</span>
      <div class="category">${escapeHtml(term.g)}</div>
      <div class="desc-preview">${escapeHtml(term.d)}</div>
    `;
    frag.appendChild(card);
  });
  gridEl.appendChild(frag);

  const total = TERMS.length;
  countTextEl.textContent = `表示中 ${filtered.length} / 全${total}語`;
  const learnedCount = Object.values(state.learned).filter(Boolean).length;
  const pct = total ? Math.round((learnedCount/total)*100) : 0;
  progressFillEl.style.width = pct + "%";
  progressTextEl.textContent = `覚えた ${learnedCount} / ${total}（${pct}%）`;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// delegate clicks on grid
gridEl.addEventListener("click", (e) => {
  const toggleLabel = e.target.closest(".learned-toggle");
  if(toggleLabel){
    e.stopPropagation();
    const id = Number(toggleLabel.dataset.id);
    toggleLearned(id);
    return;
  }
  const card = e.target.closest(".card");
  if(card){
    openModal(Number(card.dataset.id));
  }
});

function toggleLearned(id){
  if(state.learned[id]) delete state.learned[id];
  else state.learned[id] = true;
  saveLearned();
  render();
  if(state.activeId === id) syncModalLearnBtn(id);
}

// modal
const overlayEl = document.getElementById("overlay");
const mTitleEl = document.getElementById("mTitle");
const mTagEl = document.getElementById("mTag");
const mCategoryEl = document.getElementById("mCategory");
const mDescEl = document.getElementById("mDesc");
const mFeaturesEl = document.getElementById("mFeatures");
const mFeaturesListEl = document.getElementById("mFeaturesList");
const mLearnBtnEl = document.getElementById("mLearnBtn");

function openModal(id){
  const term = TERMS[id];
  state.activeId = id;
  mTitleEl.textContent = term.t;
  mTagEl.textContent = `第${term.c}章`;
  mTagEl.className = `tag ch${term.c}`;
  mCategoryEl.textContent = term.g;
  mDescEl.textContent = term.d;
  if(term.f && term.f.length){
    mFeaturesListEl.innerHTML = term.f.map(item => `<li>${escapeHtml(item)}</li>`).join("");
    mFeaturesEl.style.display = "block";
  } else {
    mFeaturesListEl.innerHTML = "";
    mFeaturesEl.style.display = "none";
  }
  syncModalLearnBtn(id);
  overlayEl.classList.add("open");
}
function syncModalLearnBtn(id){
  const isLearned = !!state.learned[id];
  mLearnBtnEl.textContent = isLearned ? "✓ 覚えた（クリックで解除）" : "未習得（クリックで覚えたにする）";
  mLearnBtnEl.classList.toggle("on", isLearned);
}
function closeModal(){
  overlayEl.classList.remove("open");
  state.activeId = null;
}
document.getElementById("closeBtn").addEventListener("click", closeModal);
overlayEl.addEventListener("click", (e) => { if(e.target === overlayEl) closeModal(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeModal(); });
