          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        hashtags:
          type: array
          items:
            type: string
        postedAt:
          type: string
          format: date-time
          nullable: true
        likeCount:
          type: integer
          format: int64
          nullable: true
        commentCount:
          type: integer
          format: int64
          nullable: true
        shareCount:
          type: integer
          format: int64
          nullable: true
        saveCount:
          type: integer
          format: int64
          nullable: true
        viewCount:
          type: integer
          format: int64
          nullable: true
