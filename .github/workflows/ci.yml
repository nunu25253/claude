name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot / Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # このリポジトリはサンドボックス環境のネットワーク制限によりGradle Wrapperを
      # コミットできていないため（services.gradle.orgへの到達不可）、
      # setup-gradleアクションでGradle本体を直接セットアップする。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run backend tests
        working-directory: backend
        run: gradle test --no-daemon

      - name: Build backend jar
        working-directory: backend
        run: gradle build -x test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          retention-days: 7

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: "E2E (主要導線: 登録→投稿分析→保存)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start full stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for backend/frontend to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null && curl -sf http://localhost:3000/login > /dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"; docker compose logs; exit 1

      - name: Verify frontend API types match backend OpenAPI contract
        working-directory: frontend
        run: |
          npm run generate:api-types
          if ! git diff --exit-code -- lib/types/generated/api.ts; then
            echo "::error::lib/types/generated/api.ts is out of date. Run 'npm run generate:api-types' (with the backend running) and commit the result."
            exit 1
          fi

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  validate-configs:
    name: Validate OpenAPI / Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OpenAPI spec
        run: |
          pip install openapi-spec-validator pyyaml
          python -c "
          import openapi_spec_validator, yaml
          spec = yaml.safe_load(open('docs/openapi.yaml'))
          openapi_spec_validator.validate(spec)
          print('OpenAPI spec valid')
          "

      - name: Validate docker-compose config
        run: docker compose config --quiet
